name: Docker build & test

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  pull_request:
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'docker/**'
      - 'docker-compose.yaml'
      - 'cmd/**'
      - 'internal/**'
      - 'web/**'
      - 'tools/**'
      - 'roles/**'
      - 'agents/**'
      - 'skills/**'
      - 'requirements.txt'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/docker.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go-test:
    name: Go vet / test / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 格式检查需要 base 提交，浅克隆拿不到 HEAD^ / event.before
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting of changed files
        run: |
          # 历史代码存在未格式化文件，因此只校验本次变更触碰的 .go 文件；
          # push 事件拿不到 pull_request.base.sha，退回与上一个提交比较。
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            files=$(git diff --name-only --diff-filter=ACMR "$base" HEAD -- '*.go')
          else
            base="${{ github.event.before }}"
            if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
              base=$(git rev-parse 'HEAD^' 2>/dev/null || true)
            fi
            if [ -n "$base" ]; then
              files=$(git diff --name-only --diff-filter=ACMR "$base" HEAD -- '*.go')
            else
              files=$(git show --pretty='' --name-only HEAD -- '*.go')
            fi
          fi
          if [ -z "$files" ]; then
            echo "没有 .go 文件变更，跳过格式检查"
            exit 0
          fi
          unformatted=$(echo "$files" | xargs -r gofmt -l)
          if [ -n "$unformatted" ]; then
            echo "以下文件未格式化："
            echo "$unformatted"
            exit 1
          fi
      - run: go vet ./...
      - name: Unit tests
        run: |
          # 全量用例以普通模式运行：internal/c2 在 -race 下会超过默认超时，
          # internal/security 的进程隔离用例需要 cgroup 特权环境。
          # internal/{c2,database,handler} 单个包耗时约 3 分钟，放宽包级超时。
          go test -timeout 30m ./internal/... ./cmd/...
      - name: Race tests
        run: |
          # 与 process-isolation.yml 保持一致，只对上游声明为竞态安全的包开 -race
          go test -race ./internal/processguard ./internal/runlease
      - name: Build server binary
        run: CGO_ENABLED=1 go build -trimpath -o /tmp/cyberstrike-ai ./cmd/server
      - name: Binary self-check
        run: /tmp/cyberstrike-ai --help

  smoke:
    name: Container smoke test
    runs-on: ubuntu-latest
    needs: go-test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build local image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: cyberstrike-ai:ci
          cache-from: type=gha
      - name: Start container
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/csai-data"
          docker run -d --name csai \
            -p 18080:8080 \
            -v "$RUNNER_TEMP/csai-data:/app/data" \
            cyberstrike-ai:ci --http
      - name: Wait for readiness
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null http://127.0.0.1:18080/; then
              echo "服务已就绪（第 ${i} 次探测）"
              exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' csai)" != "true" ]; then
              echo "容器已退出，日志如下："
              docker logs csai
              exit 1
            fi
            sleep 2
          done
          echo "等待超时，日志如下："
          docker logs csai
          exit 1
      - name: Verify generated config and data volume
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/csai-data/config.yaml"
          docker exec csai sh -c 'test -x /app/cyberstrike-ai'
          # 服务进程必须以非 root 运行；docker exec 本身是 root，故检查 PID 1 的 UID
          docker exec csai sh -c 'grep "^Uid:" /proc/1/status | grep -qw 10001'
          curl -fsS http://127.0.0.1:18080/ | grep -qi '<html'
      - name: Dump logs on failure
        if: failure()
        run: docker logs csai || true
      - name: Cleanup
        if: always()
        run: docker rm -f csai || true

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: smoke
    # 推送到 GHCR 需要 packages: write，覆盖顶层的只读声明
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          load: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
